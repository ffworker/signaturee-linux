# One-shot test-AD CLI only; no production credentials or mounts.
services:
  signaturee-test:
    build: .
    image: signaturee-linux:test
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=268435456
    volumes:
      - ./dev/config.json:/config/test.json:ro
      - ./dev/templates:/templates:ro
      - ./dev/output:/output:rw
    secrets:
      - ldap-bind-password
    environment:
      SIGNATUREE_LDAP_URL: ${SIGNATUREE_LDAP_URL:-}
      SIGNATUREE_LDAP_BASE_DN: ${SIGNATUREE_LDAP_BASE_DN:-}
      SIGNATUREE_LDAP_BIND_DN: ${SIGNATUREE_LDAP_BIND_DN:-}
      SIGNATUREE_LDAP_BIND_PASSWORD_FILE: /run/secrets/ldap-bind-password
      SIGNATUREE_LDAP_CA_FILE: ${SIGNATUREE_LDAP_CA_FILE:-}
    command: ["--help"]
secrets:
  ldap-bind-password:
    file: ./dev/ldap-bind-password
