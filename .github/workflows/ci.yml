name: Linux foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node.js 24 — syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned production dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify native LDAP dependency loads
        run: node -e "import('ldapts').then(m => { if (typeof m.Client !== 'function') process.exit(1); })"
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Check test-AD CLI help without credentials
        run: npm run test:cli:help
      - name: Generate synthetic HTML/TXT demo
        run: npm run demo
      - name: Upload HTML/TXT demo for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-linux-html-txt-demo
          path: artifacts/demo/
          if-no-files-found: error
          retention-days: 7

  libreoffice-rtf:
    name: Ubuntu LibreOffice — real RTF conversion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install headless LibreOffice Writer if absent
        run: |
          if ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer
          fi
          soffice --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual HTML to RTF conversion
        env:
          SIGNATUREE_TEST_LIBREOFFICE: "1"
        run: node --test test/conversion/rtf.test.js
      - name: Generate real RTF demo with synthetic source data
        run: npm run demo:rtf
      - name: Upload HTML/TXT/RTF sample
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-linux-html-txt-rtf-demo
          path: artifacts/demo/
          if-no-files-found: error
          retention-days: 7
      - name: Publish real synthetic signature snapshot on Linux
        run: npm run demo:publish
      - name: Upload complete snapshot directory
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-linux-published-snapshot-demo
          path: artifacts/published/
          if-no-files-found: error
          retention-days: 7
      - name: Full fake-AD to LibreOffice to snapshot smoke test
        run: npm run demo:integration
      - name: Upload full-pipeline synthetic output
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-linux-full-integration-demo
          path: artifacts/integration/
          if-no-files-found: error
          retention-days: 7

  container-smoke:
    name: Docker — non-root, read-only real RTF smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux CLI with LibreOffice
        run: docker build --pull -t signaturee-linux:test .
      - name: Verify CLI and runtime as a restricted user (no network)
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --memory 1g signaturee-linux:test --help
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --memory 1g --entrypoint node signaturee-linux:test \
            /app/scripts/container-smoke.js
      - name: Validate Compose configuration without secrets or AD access
        run: |
          mkdir -p dev/templates dev/output
          printf 'test' > dev/config.json
          printf 'fake' > dev/ldap-bind-password
          docker compose config --quiet
