name: Linux foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node.js 24 — syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Generate synthetic HTML/TXT demo
        run: npm run demo
      - name: Upload HTML/TXT demo for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-linux-html-txt-demo
          path: artifacts/demo/
          if-no-files-found: error
          retention-days: 7
