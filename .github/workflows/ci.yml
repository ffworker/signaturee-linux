name: Linux foundation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node.js 24 — syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned production dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify native LDAP dependency loads
        run: node -e "import('ldapts').then(m => { if (typeof m.Client !== 'function') process.exit(1); })"
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Check test-AD CLI help without credentials
        run: npm run test:cli:help
      - name: Generate synthetic HTML/TXT demo
        run: npm run demo
      - name: Upload HTML/TXT demo for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-linux-html-txt-demo
          path: artifacts/demo/
          if-no-files-found: error
          retention-days: 7

  libreoffice-rtf:
    name: Ubuntu LibreOffice — real RTF conversion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install headless LibreOffice Writer if absent
        run: |
          if ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer
          fi
          soffice --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual HTML to RTF conversion
        env:
          SIGNATUREE_TEST_LIBREOFFICE: "1"
        run: node --test test/conversion/rtf.test.js
      - name: Generate real RTF demo with synthetic source data
        run: npm run demo:rtf
      - name: Upload HTML/TXT/RTF sample
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-linux-html-txt-rtf-demo
          path: artifacts/demo/
          if-no-files-found: error
          retention-days: 7
      - name: Publish real synthetic signature snapshot on Linux
        run: npm run demo:publish
      - name: Upload complete snapshot directory
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-linux-published-snapshot-demo
          path: artifacts/published/
          if-no-files-found: error
          retention-days: 7
      - name: Full fake-AD to LibreOffice to snapshot smoke test
        run: npm run demo:integration
      - name: Upload full-pipeline synthetic output
        uses: actions/upload-artifact@v4
        with:
          name: signaturee-linux-full-integration-demo
          path: artifacts/integration/
          if-no-files-found: error
          retention-days: 7

  container-smoke:
    name: Docker — non-root, read-only real RTF smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce real-machine offline acceptance (no network)
        run: bash scripts/verify-docker.sh
      - name: Validate Compose configuration without secrets or AD access
        run: |
          mkdir -p dev/templates dev/output
          cp .env.example .env
          docker compose config --quiet
          docker compose run --rm signaturee-test --env-config --user test.user --signature HR --preview --ack-test-directory >/tmp/signaturee-env-smoke.log 2>&1 && exit 1 || true
          grep -q 'FAIL:' /tmp/signaturee-env-smoke.log

      - name: Run real offline browser demo (no LDAP) and download RTF
        run: |
          docker compose --profile demo up -d --build signaturee-demo
          trap 'docker compose --profile demo logs signaturee-demo; docker compose --profile demo down --volumes' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8789/api/health >/tmp/signaturee-health.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          grep -q '"ldap":false' /tmp/signaturee-health.json
          curl -fsS http://127.0.0.1:8789/api/preview >/tmp/signaturee-preview.json
          grep -q '"accountName":"example.user"' /tmp/signaturee-preview.json
          curl -fsS -X POST -H 'Origin: http://127.0.0.1:8789' \
            http://127.0.0.1:8789/api/generate >/tmp/signaturee-generated.json
          grep -q '"status":"generated"' /tmp/signaturee-generated.json
          curl -fsS http://127.0.0.1:8789/api/download/rtf -o /tmp/signaturee-demo.rtf
          head -c 6 /tmp/signaturee-demo.rtf | grep -qaF '{\rtf1'

      - name: Test custom local templates through offline workbench (no LDAP)
        run: |
          mkdir -p dev/templates
          printf '%s\n' '<html><body><p>$displayName / $footer</p></body></html>' > dev/templates/HR_Template.htm
          printf '%s\n' '$displayName / $footer' > dev/templates/HR_Template.txt
          docker compose --profile workbench up -d --build signaturee-workbench
          trap 'docker compose --profile workbench logs signaturee-workbench; docker compose --profile workbench down --volumes' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8790/api/health > /tmp/signaturee-workbench-health.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          grep -q '"mode":"offline-workbench"' /tmp/signaturee-workbench-health.json
          curl -fsS http://127.0.0.1:8790/api/preview > /tmp/signaturee-workbench-preview.json
          grep -q '"key":"HR"' /tmp/signaturee-workbench-preview.json
          grep -q 'Alex Müller (Offline Test)' /tmp/signaturee-workbench-preview.json
          curl -fsS -X POST -H 'Origin: http://127.0.0.1:8790' \
            http://127.0.0.1:8790/api/generate > /tmp/signaturee-workbench-generated.json
          grep -q '"key":"HR"' /tmp/signaturee-workbench-generated.json
          curl -fsS http://127.0.0.1:8790/api/download/rtf -o /tmp/signaturee-workbench-hr.rtf
          head -c 6 /tmp/signaturee-workbench-hr.rtf | grep -qaF '{\rtf1'
          # The workbench may see offline demo fields, but MUST NOT receive the AD credentials.
          container="$(docker compose --profile workbench ps -q signaturee-workbench)"
          ! docker inspect "$container" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^SIGNATUREE_LDAP_'
